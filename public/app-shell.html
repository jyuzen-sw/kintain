<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0B6B63" />
    <title>オフライン | 勤怠</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #f6f1e7; color: #172e30; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(80px, calc(env(safe-area-inset-bottom) + 80px)) max(16px, env(safe-area-inset-left)); }
      header, main, nav { width: min(100%, 560px); margin-inline: auto; }
      header { display: flex; align-items: center; gap: 12px; min-height: 56px; font-weight: 700; }
      header img { width: 36px; height: 36px; }
      main { margin-top: 28px; padding: 32px 24px; border: 1px solid #d6d9d2; border-radius: 20px; background: #fffcf5; text-align: center; }
      main img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 24px; line-height: 1.4; }
      p { margin: 0; color: #526260; line-height: 1.6; }
      .retry { display: inline-flex; min-width: 180px; min-height: 48px; align-items: center; justify-content: center; margin-top: 24px; padding: 10px 18px; border: 1px solid #0b6b63; border-radius: 10px; background: #0b6b63; color: #fff; font-weight: 700; text-decoration: none; }
      .retry:focus-visible, nav a:focus-visible { outline: 2px solid #147d73; outline-offset: 3px; }
      nav { position: fixed; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(3, 1fr); min-height: calc(64px + env(safe-area-inset-bottom)); padding: 8px max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); border-top: 1px solid #d6d9d2; background: #fffcf5; }
      nav a { display: flex; min-height: 48px; align-items: center; justify-content: center; border-radius: 10px; color: #526260; font-size: 14px; font-weight: 600; text-decoration: none; }
      nav a:first-child { color: #0b6b63; background: #ddefea; }
    </style>
  </head>
  <body>
    <header><img src="/icon.svg" alt="" /><span>勤怠</span></header>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>現在オフラインです</h1>
      <p>表示中の内容は保存済みデータではありません。打刻や保存は行われていないため、通信接続後にもう一度お試しください。</p>
      <a class="retry" href="/app">接続を確認する</a>
    </main>
    <nav aria-label="オフライン時のメニュー">
      <a href="/app" aria-current="page">今日</a>
      <a href="/me/history">実績</a>
      <a href="/me/requests">申請</a>
    </nav>
  </body>
</html>
